name: CI/CD Pipeline — Preview & Compression Services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  PREVIEW_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/preview-service
  COMPRESSION_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/compression-service

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1: LINT
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [preview-service, compression-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run ESLint
        working-directory: ${{ matrix.service }}
        run: npx eslint src/ --ext .js --max-warnings 0 || true

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2: BUILD + TEST
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [preview-service, compression-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package.json

      - name: Install dependencies (Build stage)
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: Run integration tests
        working-directory: ${{ matrix.service }}
        run: npm run test:integration
        env:
          NODE_ENV: test

      - name: Run all tests with coverage
        working-directory: ${{ matrix.service }}
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/tests/coverage/
          retention-days: 30

      - name: Print coverage summary to CI log
        working-directory: ${{ matrix.service }}
        run: cat tests/coverage/lcov-report/index.html || echo "Coverage report generated"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3: DOCKER BUILD + PUSH
  # ══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: preview-service
            image: ${{ secrets.DOCKERHUB_USERNAME }}/preview-service
          - service: compression-service
            image: ${{ secrets.DOCKERHUB_USERNAME }}/compression-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 4: DEPLOY TO KUBERNETES
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=./kubeconfig.yaml

      - name: Update image tags in Helm values
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s/tag: latest/tag: sha-${SHA}/g" helm/chart/values.yaml
          sed -i "s/YOUR_DOCKERHUB_USERNAME/${{ secrets.DOCKERHUB_USERNAME }}/g" helm/chart/values.yaml

      - name: Deploy with Helm
        run: |
          export KUBECONFIG=./kubeconfig.yaml
          helm upgrade --install cse474 ./helm/chart \
            --namespace cse474-prod \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set previewService.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/preview-service \
            --set compressionService.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/compression-service

      - name: Verify deployment
        run: |
          export KUBECONFIG=./kubeconfig.yaml
          kubectl rollout status deployment/preview-service -n cse474-prod --timeout=3m
          kubectl rollout status deployment/compression-service -n cse474-prod --timeout=3m
          echo "Deployment successful!"
