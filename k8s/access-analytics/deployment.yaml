apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-analytics-deployment
  labels:
    app: access-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: access-analytics
  template:
    metadata:
      labels:
        app: access-analytics
    spec:
      containers:
      - name: access-analytics
        image: ghcr.io/username/access-analytics:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: access-analytics-config
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
        livenessProbe:
          httpGet:
            path: /health
            port: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: access-analytics-service
spec:
  selector:
    app: access-analytics
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
