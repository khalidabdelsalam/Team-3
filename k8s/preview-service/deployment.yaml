apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-service
  namespace: cse474-prod
  labels:
    app: preview-service
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: preview-service
  template:
    metadata:
      labels:
        app: preview-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3001"
    spec:
      containers:
        - name: preview-service
          image: m91011/preview-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http

          # Resource limits and requests
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Liveness probe — is the service alive?
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe — is the service ready to receive traffic?
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: services-config

          # DB credentials from Secret
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: PREVIEW_PORT
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: PREVIEW_SERVICE_NAME
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PREVIEW_DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PREVIEW_DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PREVIEW_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PREVIEW_DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PREVIEW_DB_PASS
            - name: KAFKA_GROUP_ID
              value: "preview-service-group"
