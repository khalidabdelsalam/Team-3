global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cse474-monitor'
    environment: 'production'

scrape_configs:
  # Preview Service metrics
  - job_name: 'preview-service'
    static_configs:
      - targets: ['preview-service:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Compression Service metrics
  - job_name: 'compression-service'
    static_configs:
      - targets: ['compression-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Kubernetes pod autodiscovery
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['cse474-prod']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
